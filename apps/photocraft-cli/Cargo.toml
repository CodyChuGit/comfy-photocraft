[package]
name = "photocraft-cli"
description = "Headless PhotoCraft: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional photocraft-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["photocraft-codecs/heif"]
# The native worker serves Qwen-Image-2.1 too (needs nvcc; see crates/genai/Cargo.toml).
native-diffusion = ["photocraft-genai/native-diffusion"]

[lints]
workspace = true

[lib]
name = "photocraft_cli"
path = "src/lib.rs"

[[bin]]
name = "photocraft-cli"
path = "src/main.rs"

[dependencies]
photocraft-automation = { path = "../../crates/automation" }
photocraft-engine = { workspace = true }
photocraft-genai = { workspace = true }
photocraft-io = { workspace = true }
photocraft-format = { path = "../../crates/format" }
photocraft-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# The in-process fake ComfyUI server, for the batch tests that run generative steps.
photocraft-genai = { workspace = true, features = ["fake-server"] }

[build-dependencies]
# Icon + VERSIONINFO for photocraft-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

