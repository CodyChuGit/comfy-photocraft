# Windows on ARM: package the ARM64 release the way release.yml does (cross-compiled on an x64
# runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner, check the installed
# binaries are ARM64, run the CLI natively, and uninstall. (A native ARM64 `cargo test` job is left
# out for now: PdfCraft saw an intermittent access violation in egui UI tests there.)
name: Windows ARM64

# Nightly on main (dependency and runner-image drift shows up within a day), and on PRs that
# change the Windows packaging itself.
on:
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/windows-arm64.yml
      - .github/workflows/windows-arm64-shared.yml
      - packaging/windows/**
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    # The shared workflow at 8bb4e5ab plus the genai-native deploy key (see windows-arm64-shared.yml).
    uses: ./.github/workflows/windows-arm64-shared.yml
    secrets:
      GENAI_NATIVE_DEPLOY_KEY: ${{ secrets.GENAI_NATIVE_DEPLOY_KEY }}
    with:
      app-name: photocraft
      app-dir: PhotoCraft
      install-relative-path: Programs/ArtCraft/PhotoCraft
      install-scope: perUser
