[package]
name = "photocraft-genai"
description = "Local generative backends for PhotoCraft: the GenerativeBackend trait, the native worker and model metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# An in-process fake native worker for this crate's tests and for
# the engine's `generate.*` command tests. Never enabled in a shipped build.
fake-server = []
# The native worker also serves Qwen-Image-2.1 text to image (`gn-diffusion`: candle + the CUDA
# kernels of qwen-image-rs, plan Phase 2). Off by default: it needs nvcc, CUTLASS and a CUDA
# toolkit to build (docs/comfy/dev-environment-windows.md); the SAM 3.1 route needs none of that.
# With it, SAM 3.1 also runs on candle on the GPU from its checkpoint (no ONNX Runtime).
native-diffusion = ["dep:gn-diffusion", "gn-perception/cuda"]
# SAM 3.1's exported graphs through ONNX Runtime, the route without nvcc (the apps turn it on
# by default; the workspace takes this crate without defaults). The -Native package builds
# without it: SAM 3.1 then runs on candle only and no `ort` is in the worker (Rust rebuild R1).
sam-onnx = ["gn-perception/onnx"]
default = ["sam-onnx"]

[dependencies]
photocraft-codecs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The native worker protocol uses loopback IPC. Wasm has no local worker client; seeds
# there use a counter instead of requiring a JS backend for getrandom.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }
# The native engine's worker channel (plan-native-engine §3.4) and its perception models (SAM 3.1
# through ONNX Runtime, plan Phase 1), pinned by commit; the repository is private for now, so
# `.cargo/config.toml` fetches it with the system git. The runtime library itself is loaded at run
# time from a folder the user names (`integrations.runtimePath`); nothing is linked.
gn-engine = { git = "https://github.com/CodyChuGit/genai-native.git", rev = "e9a4ea1a263e0eaf5a8442b0b7e471074e764762" }
gn-perception = { git = "https://github.com/CodyChuGit/genai-native.git", rev = "e9a4ea1a263e0eaf5a8442b0b7e471074e764762", default-features = false, features = ["engine"] }
gn-diffusion = { git = "https://github.com/CodyChuGit/genai-native.git", rev = "e9a4ea1a263e0eaf5a8442b0b7e471074e764762", features = ["cuda"], optional = true }
# The worker's log: the engines speak `tracing`; with `RUST_LOG` set the worker writes their
# phase timings (load, encode, sampling, decode) to its stderr.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
