[package]
name = "photocraft-genai"
description = "Local generative backends for PhotoCraft: the GenerativeBackend trait, a ComfyUI client and workflow templates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# An in-process fake ComfyUI server (HTTP + WebSocket on loopback) for this crate's tests and for
# the engine's `generate.*` command tests. Never enabled in a shipped build.
fake-server = []
# The native worker also serves Qwen-Image-2.1 text to image (`gn-diffusion`: candle + the CUDA
# kernels of qwen-image-rs, plan Phase 2). Off by default: it needs nvcc, CUTLASS and a CUDA
# toolkit to build (docs/comfy/dev-environment-windows.md); the SAM 3.1 route needs none of that.
native-diffusion = ["dep:gn-diffusion"]

[dependencies]
photocraft-codecs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The client talks to a loopback server over plain HTTP and WebSocket, so no TLS stack is built.
# Both crates are pure Rust. The web build has no client yet (commands report "unsupported"), and
# `getrandom` needs a JS backend there, so seeds on wasm come from a counter instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }
ureq = { version = "3.4", default-features = false }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The native engine's worker channel (plan-native-engine §3.4) and its perception models (SAM 3.1
# through ONNX Runtime, plan Phase 1), pinned by commit; the repository is private for now, so
# `.cargo/config.toml` fetches it with the system git. The runtime library itself is loaded at run
# time from a folder the user names (`integrations.runtimePath`); nothing is linked.
gn-engine = { git = "https://github.com/CodyChuGit/genai-native.git", rev = "f2bf49672d4adae80466a7c161b3745d07792157" }
gn-perception = { git = "https://github.com/CodyChuGit/genai-native.git", rev = "f2bf49672d4adae80466a7c161b3745d07792157", features = ["engine"] }
gn-diffusion = { git = "https://github.com/CodyChuGit/genai-native.git", rev = "f2bf49672d4adae80466a7c161b3745d07792157", features = ["cuda"], optional = true }
# The worker's log: the engines speak `tracing`; with `RUST_LOG` set the worker writes their
# phase timings (load, encode, sampling, decode) to its stderr.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
