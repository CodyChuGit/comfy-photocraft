[package]
name = "gn-perception"
description = "Perception models of genai-native: SAM 3.1 on candle (text, point and box prompts to masks) behind gn-engine's worker protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# The worker-side `Engine` over gn-engine's protocol (what `photocraft --engine` serves).
engine = ["dep:gn-engine"]
# SAM 3.1 on candle from its own checkpoint (`gn-segment`; Rust rebuild R1).
candle = ["dep:gn-segment", "dep:candle-core", "dep:anyhow"]
# The same on the GPU.
cuda = ["candle", "gn-segment/cuda", "candle-core/cuda"]
# The Apple GPU (macOS), through candle's Metal backend.
metal = ["candle", "gn-segment/metal", "candle-core/metal"]

[dependencies]
serde_json = { workspace = true }
gn-engine = { path = "../gn-engine", version = "0.1.0", optional = true }
gn-segment = { path = "../gn-segment", version = "0.1.0", optional = true }
candle-core = { version = "0.11", optional = true }
anyhow = { version = "1", optional = true }
